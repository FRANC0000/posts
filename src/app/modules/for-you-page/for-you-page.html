<div class="min-h-screen pb-20 md:pb-0" [style.background]="'var(--app-bg)'">
  
  <header class="sticky top-0 z-10 flex items-center justify-between px-4 py-3 backdrop-blur-md md:hidden border-b transition-colors"
          [style.background]="'var(--app-header-bg)'"
          [style.border-color]="'var(--app-border)'">
    <h1 class="text-xl font-bold tracking-tight" [style.color]="'var(--app-text-main)'">Para ti</h1>
    <button [style.color]="'var(--app-text-muted)'" class="hover:opacity-70">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
    </button>
  </header>

  <main class="mx-auto max-w-2xl py-4 md:py-8">
    <div class="space-y-6 px-4">
      
      <article class="overflow-hidden rounded-2xl border shadow-sm transition-all hover:shadow-md"
               [style.background]="'var(--app-card-bg)'"
               [style.border-color]="'var(--app-border)'">
        
        <div class="flex items-center space-x-3 p-4">
          <div class="h-10 w-10 rounded-full flex-shrink-0 overflow-hidden" [style.background]="'var(--app-border)'">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar" />
          </div>
          <div class="flex-1">
            <h3 class="text-sm font-semibold" [style.color]="'var(--app-text-main)'">el_dev_creativo</h3>
            <p class="text-xs" [style.color]="'var(--app-text-muted)'">Hace 2 horas</p>
          </div>
          <button [style.color]="'var(--app-text-muted)'" class="hover:opacity-80">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z" />
            </svg>
          </button>
        </div>

        <div class="px-4 pb-4">
          <p class="text-sm leading-relaxed" [style.color]="'var(--app-text-main)'">
            Hoy configuramos <span class="font-mono text-blue-500">Tailwind v4</span> en un contenedor Docker. ¡La velocidad es increíble! 🚀 #Angular #WebDev
          </p>
        </div>

        <div class="flex items-center justify-between border-t p-4" [style.border-color]="'var(--app-border)'">
          <div class="flex space-x-6">
            <button class="flex items-center space-x-2 transition-colors hover:text-red-500" [style.color]="'var(--app-text-muted)'">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
              <span class="text-xs font-medium">245</span>
            </button>
            <button class="flex items-center space-x-2 transition-colors hover:text-blue-500" [style.color]="'var(--app-text-muted)'">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
              </svg>
              <span class="text-xs font-medium">18</span>
            </button>
          </div>
          <button class="transition-colors hover:opacity-70" [style.color]="'var(--app-text-muted)'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
          </button>
        </div>
      </article>

    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 border-t px-6 py-3 backdrop-blur-lg md:hidden transition-colors"
       [style.background]="'var(--app-nav-bg)'"
       [style.border-color]="'var(--app-border)'">
    <div class="flex items-center justify-between">
      <button [style.color]="'var(--app-text-main)'">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
        </svg>
      </button>
      
      <button class="rounded-lg p-2 transition-transform active:scale-90"
              [style.background]="'var(--app-accent)'"
              [style.color]="'var(--app-accent-text)'">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </button>

      <div class="h-7 w-7 rounded-full border border-zinc-200" [style.background]="'var(--app-border)'">
         <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar" class="rounded-full" />
      </div>
    </div>
  </nav>
</div>
