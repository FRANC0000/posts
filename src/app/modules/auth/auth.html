<div class="min-h-screen flex items-center justify-center px-4" [style.background]="'var(--app-bg)'">
  <div class="w-full max-w-[400px] space-y-6">
    
    <div class="flex flex-col space-y-2 text-center">
      <h1 class="text-2xl font-semibold tracking-tight" [style.color]="'var(--app-text-main)'">
        Bienvenido de nuevo
      </h1>
      <p class="text-sm" [style.color]="'var(--app-text-muted)'">
        Introduce tu email para acceder a tu cuenta
      </p>
    </div>

    <div class="p-6 border rounded-xl shadow-sm transition-colors" 
         [style.background]="'var(--app-card)'" 
         [style.border-color]="'var(--app-border)'">
      
      <form class="space-y-4">
        
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none" [style.color]="'var(--app-text-main)'">
            Email
          </label>
          <input
            type="email"
            placeholder="nombre@ejemplo.com"
            class="flex h-10 w-full rounded-md border bg-transparent px-3 py-2 text-sm focus:outline-none focus:ring-2"
            [style.border-color]="'var(--app-input)'"
            [style.color]="'var(--app-text-main)'"
          />
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-sm font-medium leading-none" [style.color]="'var(--app-text-main)'">
              Contraseña
            </label>
            <a href="#" class="text-xs underline underline-offset-4" [style.color]="'var(--app-text-muted)'">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
          <input
            type="password"
            class="flex h-10 w-full rounded-md border bg-transparent px-3 py-2 text-sm focus:outline-none"
            [style.border-color]="'var(--app-input)'"
            [style.color]="'var(--app-text-main)'"
          />
        </div>

        <button type="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border h-10 px-4 py-2 w-full"
                [style.background]="'var(--app-card)'"
                [style.border-color]="'var(--app-border)'"
                [style.color]="'var(--app-text-main)'">
            Iniciar Sesión
        </button>

        <div class="relative my-4">
          <div class="relative flex justify-center text-xs uppercase">
            <span class="px-2" [style.background]="'var(--app-card)'" [style.color]="'var(--app-text-muted)'">
              O continuar con
            </span>
          </div>
        </div>

        <button type="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border h-10 px-4 py-2 w-full"
                [style.background]="'var(--app-card)'"
                [style.border-color]="'var(--app-border)'"
                [style.color]="'var(--app-text-main)'">
          Google
        </button>
      </form>
    </div>

    <p class="text-center text-sm" [style.color]="'var(--app-text-muted)'">
      ¿No tienes una cuenta? 
      <a href="#" class="font-medium hover:underline underline-offset-4" [style.color]="'var(--app-text-main)'">
        Regístrate
      </a>
    </p>
  </div>
</div>
