        </p>
      </div>

            />
          </div>
  
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium leading-none" for="password">
                Contraseña
              </label>
              <a href="#" class="text-xs text-zinc-500 hover:text-zinc-900 underline underline-offset-4">
                ¿Olvidaste tu contraseña?
              </a>

              id="password"

            />

            Iniciar Sesión
          </button>
  
          <div class="relative my-4">
            <div class="absolute inset-0 flex items-center">
              <span class="w-full border-t border-zinc-200"></span>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
              <span class="bg-white px-2 text-zinc-500">O continuar con</span>
            </div>
          </div>
  
          <button type="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border border-zinc-200 bg-white hover:bg-zinc-100 hover:text-zinc-900 h-10 px-4 py-2 w-full">
