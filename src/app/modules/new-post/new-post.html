
<div class="fixed inset-0 z-[60] flex items-center justify-center backdrop-blur-sm p-4 transition-colors duration-300"
     [style.background]="'var(--app-modal-overlay)'">
  
  <div class="w-full max-w-lg overflow-hidden rounded-xl border shadow-2xl transition-all duration-300"
       [style.background]="'var(--app-card-bg)'"
       [style.border-color]="'var(--app-border)'">
    
    <div class="flex items-center justify-between border-b p-4" 
         [style.border-color]="'var(--app-border)'">
      <h3 class="text-lg font-semibold" [style.color]="'var(--app-text-main)'">
        Crear nueva publicación
      </h3>
      <button (click)="cancelar()" 
              class="rounded-full p-1 transition-colors hover:opacity-70"
              [style.color]="'var(--app-text-muted)'">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <div class="p-4">
      <div class="flex gap-4">
        <div class="h-10 w-10 flex-shrink-0 rounded-full overflow-hidden" 
             [style.background]="'var(--app-border)'">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar" />
        </div>
        
        <div class="w-full">
          <textarea
            rows="4"
            placeholder="¿Qué estás pensando?"
            class="w-full resize-none border-none bg-transparent focus:ring-0 sm:text-base outline-none"
            [style.color]="'var(--app-text-main)'"
          ></textarea>
        </div>
      </div>

      <!-- <div class="mt-4 rounded-lg border border-dashed p-8 text-center transition-colors cursor-pointer"
           [style.border-color]="'var(--app-input)'"
           [style.background]="'var(--app-bg)'"
           onmouseover="this.style.backgroundColor='var(--app-hover-bg)'"
           onmouseout="this.style.backgroundColor='var(--app-bg)'">
         <p class="text-sm" [style.color]="'var(--app-text-muted)'">
           Haz clic para subir una imagen
         </p>
      </div> -->
    </div>

    <div class="flex items-center justify-between border-t p-4 transition-colors duration-300" 
         [style.border-color]="'var(--app-border)'"
         [style.background]="'var(--app-modal-footer)'">
      
      <div class="flex gap-2">
        <button class="flex items-center justify-center rounded-md p-2 transition-colors hover:opacity-70"
                [style.color]="'var(--app-text-muted)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </button>
        <button class="flex items-center justify-center rounded-md p-2 transition-colors hover:opacity-70"
                [style.color]="'var(--app-text-muted)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
      </div>

      <div class="flex gap-3">
        <button (click)="cancelar()" 
                class="px-4 py-2 text-sm font-medium transition-colors hover:opacity-80"
                [style.color]="'var(--app-text-muted)'">
          Cancelar
        </button>
        <button class="rounded-md px-4 py-2 text-sm font-medium transition-all shadow-sm active:scale-95"
                [style.background]="'var(--app-primary)'"
                [style.color]="'var(--app-accent)'">
          Publicar
        </button>
      </div>
    </div>
  </div>
</div>
