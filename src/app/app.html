<div class="min-h-screen transition-colors duration-300" [style.background]="'var(--app-bg)'">
  
  <nav class="hidden md:flex items-center justify-between px-8 py-4 border-b sticky top-0 z-50 transition-colors duration-300"
       [style.background]="'var(--app-card-bg)'"
       [style.border-color]="'var(--app-border)'">
    
    <div class="flex items-center gap-8">
      <h2 class="text-xl font-bold tracking-tighter" [style.color]="'var(--app-text-main)'">PostsDev</h2>
      
      <div class="flex gap-2">
        <a routerLink="/fyp" 
           routerLinkActive 
           #rlaFeed="routerLinkActive"
           [routerLinkActiveOptions]="{exact: true}"
           [style.background]="rlaFeed.isActive ? 'var(--app-hover-bg)' : 'transparent'"
           [style.color]="rlaFeed.isActive ? 'var(--app-text-main)' : 'var(--app-text-muted)'"
           class="px-4 py-2 rounded-md text-sm font-medium hover:opacity-80 transition-all">
          Feed
        </a>
        <a routerLink="/auth" 
           routerLinkActive 
           #rlaProfile="routerLinkActive"
           [style.background]="rlaProfile.isActive ? 'var(--app-hover-bg)' : 'transparent'"
           [style.color]="rlaProfile.isActive ? 'var(--app-text-main)' : 'var(--app-text-muted)'"
           class="px-4 py-2 rounded-md text-sm font-medium hover:opacity-80 transition-all">
          Mi Perfil
        </a>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button type="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors border h-10 px-4 py-2 w-full"
            [style.background]="'var(--app-card)'"
            [style.border-color]="'var(--app-border)'"
            [style.color]="'var(--app-text-main)'"
            (click)="toggleModal()">
        Nueva Publicación
      </button>
    
      <app-theme></app-theme>
    </div>
  </nav>

  @if (isModalOpen) {
    <app-new-post (onClose)="toggleModal()"></app-new-post>
  }

  <main class="pb-20 md:pb-0">
    <router-outlet></router-outlet>
  </main>

  <nav class="md:hidden fixed bottom-0 left-0 right-0 border-t px-6 py-3 flex justify-around items-center z-50 transition-colors duration-300"
       [style.background]="'var(--app-card-bg)'"
       [style.border-color]="'var(--app-border)'">
    
    <a routerLink="/fyp" 
       routerLinkActive 
       #rlaMobileFeed="routerLinkActive"
       [style.color]="rlaMobileFeed.isActive ? 'var(--app-text-main)' : 'var(--app-text-muted)'"
       class="flex flex-col items-center gap-1 transition-all"
       [class.scale-110]="rlaMobileFeed.isActive">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-[10px] font-medium">Feed</span>
    </a>

    <a routerLink="/auth" 
       routerLinkActive 
       #rlaMobileProfile="routerLinkActive"
       [style.color]="rlaMobileProfile.isActive ? 'var(--app-text-main)' : 'var(--app-text-muted)'"
       class="flex flex-col items-center gap-1 transition-all"
       [class.scale-110]="rlaMobileProfile.isActive">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="text-[10px] font-medium">Perfil</span>
    </a>
  </nav>
</div>
