<!-- Contenedor Principal -->
<div class="min-h-screen bg-zinc-50">
  
  <!-- Navegación Superior (Escritorio) -->
  <nav class="hidden md:flex items-center justify-between px-8 py-4 bg-white border-b border-zinc-200 sticky top-0 z-50">
    <div class="flex items-center gap-8">
      <h2 class="text-xl font-bold tracking-tighter text-zinc-900">PostsDev</h2>
      
      <div class="flex gap-2">
        <a routerLink="/fyp" 
           routerLinkActive="bg-zinc-100 text-zinc-900" 
           [routerLinkActiveOptions]="{exact: true}"
           class="px-4 py-2 rounded-md text-sm font-medium text-zinc-500 hover:text-zinc-900 hover:bg-zinc-50 transition-colors">
          Feed
        </a>
        <a routerLink="/auth" 
           routerLinkActive="bg-zinc-100 text-zinc-900"
           class="px-4 py-2 rounded-md text-sm font-medium text-zinc-500 hover:text-zinc-900 hover:bg-zinc-50 transition-colors">
          Mi Perfil
        </a>
      </div>
    </div>

    <button class="bg-zinc-900 text-zinc-50 px-4 py-2 rounded-md text-sm font-medium hover:bg-zinc-800 transition-colors">
      Nueva Publicación
    </button>
  </nav>

  <!-- Contenido Dinámico -->
  <main class="pb-20 md:pb-0">
    <router-outlet></router-outlet>
  </main>

  <!-- Navegación Inferior (Móvil) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200 px-6 py-3 flex justify-around items-center z-50">
    <a routerLink="/feed" 
       routerLinkActive="text-zinc-900 scale-110" 
       class="flex flex-col items-center gap-1 text-zinc-400 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-[10px] font-medium">Feed</span>
    </a>

    <a routerLink="/login" 
       routerLinkActive="text-zinc-900 scale-110"
       class="flex flex-col items-center gap-1 text-zinc-400 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="text-[10px] font-medium">Perfil</span>
    </a>
  </nav>
</div>
